name: Docs

# Builds on every pull request, so a broken docs build is caught before merging, and
# deploys to GitHub Pages when main moves. The build runs with --strict, which turns a
# dead cross-reference or a page missing from the nav into a failure rather than a
# quietly broken site.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # mkdocstrings imports the package to read its docstrings, so the project itself
      # has to be installed, not just the docs toolchain.
      - name: Install the project and the docs toolchain
        run: uv sync --group docs

      - name: Regenerate the changelog page
        run: |
          {
            echo '<!-- Generated from CHANGELOG.md by the docs build; edit that file instead. -->'
            echo
            cat CHANGELOG.md
          } > docs/changelog.md

      - name: Build
        run: uv run mkdocs build --strict

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Only main publishes; a pull request gets the build check and nothing more.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
