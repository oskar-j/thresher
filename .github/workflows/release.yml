name: Release

# Publishes a GitHub Release, then the same artifacts to PyPI, whenever a
# version bump lands on main.
#
# The version in pyproject.toml is the single source of truth; the release is
# tagged v<version> and its notes are taken from the matching CHANGELOG.md
# section. Re-running on an already-released version is a no-op, so ordinary
# pushes to main that do not change the version are safely ignored.
#
# The PyPI upload is a dependent job rather than a separate workflow listening
# for `release: published`. That is deliberate: releases created with the
# default GITHUB_TOKEN do not trigger further workflow runs, so a
# `release`-triggered workflow would never fire here.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.check.outputs.exists == 'false' }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Resolve version
        id: version
        run: |
          VERSION=$(uv version --short)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version ${VERSION}"

      - name: Check whether the release already exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.version.outputs.tag }} already exists - nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes from CHANGELOG.md
        if: steps.check.outputs.exists == 'false'
        run: |
          awk -v ver="${{ steps.version.outputs.version }}" '
            $0 ~ "^## \\[" ver "\\]" { flag = 1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No CHANGELOG.md section found for ${{ steps.version.outputs.version }}." >&2
            exit 1
          fi
          cat release_notes.md

      - name: Build distributions
        if: steps.check.outputs.exists == 'false'
        run: uv build

      # Hand the exact same artifacts to the PyPI job, rather than rebuilding
      # them there, so what is on PyPI matches what is on the release.
      - name: Upload distributions for the PyPI job
        if: steps.check.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - name: Create the GitHub Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file release_notes.md \
            --target "${GITHUB_SHA}" \
            dist/*

  publish-pypi:
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/thresher-py

    # Trusted Publishing (OIDC) - no API token is stored in this repository.
    permissions:
      id-token: write

    steps:
      - name: Download the distributions built for the release
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
