name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Runs exactly the hooks in .pre-commit-config.yaml (ruff, ruff-format, mypy and the
  # file hygiene checks), so a clean local `pre-commit run --all-files` means a green job.
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install the project and its dev dependencies
        run: uv sync --group dev

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      # PySpark runs on the JVM, and 4.x needs Java 17 or newer. The runner image happens
      # to ship a JDK, but pinning one here means an image update cannot quietly change
      # which - or remove it - and take tests/test_spark.py down with it.
      - name: Set up the JDK PySpark needs
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The dev group carries pyspark, a 450 MB sdist, so this step is slower than it
      # looks. It buys the Spark interface being exercised on every Python version rather
      # than only the one a dedicated job would pick.
      - name: Install the project and its dev dependencies
        run: uv sync --group dev

      # --cov applies the fail_under threshold from [tool.coverage.report] in
      # pyproject.toml, so a pull request that drops coverage below it fails here and
      # cannot be merged - the `test` jobs are required checks on main.
      - name: Run tests with coverage
        run: uv run pytest -v --cov --cov-report=term-missing --cov-report=xml

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn
