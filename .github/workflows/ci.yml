name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the project and its dev dependencies
        run: uv sync --group dev

      # The suite loads its .xlsx fixtures via a relative './' path, so it only
      # passes when run from inside thresher/tests.
      - name: Run tests
        working-directory: thresher/tests
        run: uv run python -m unittest test -v
