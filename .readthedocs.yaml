# Read the Docs configuration.
#
# The project publishes to GitHub Pages from .github/workflows/docs.yml, which needs no
# third-party account. This file is here so Read the Docs works too, for anyone who
# prefers it: import the repository at https://app.readthedocs.org/ and it will pick this
# up. Nothing else is required.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    install:
      # uv resolves the docs group from pyproject.toml, so the two hosts build from the
      # same dependency set rather than drifting apart.
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
      - uv sync --group docs
    build:
      html:
        - uv run mkdocs build --strict --site-dir $READTHEDOCS_OUTPUT/html

mkdocs:
  configuration: mkdocs.yml
