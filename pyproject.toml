[project]
name = "thresher-py"
version = "0.7.3"
description = "Find threshold for fine-tuning output from predict_proba"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Oskar Jarczyk", email = "oskar.jarczyk@gmail.com" }]
maintainers = [{ name = "Oskar Jarczyk", email = "oskar.jarczyk@gmail.com" }]
keywords = ["Hyper-parameters", "Finetuning", "ML", "Optimization", "AutoML"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["numpy", "pandas", "click>=8.0"]

[project.scripts]
thresher = "thresher.cli:main"

[project.optional-dependencies]
# Ray publishes wheels for Linux (x86_64 and aarch64) and Apple Silicon only - there is no
# macOS x86_64 wheel, so `pip install thresher-py[ray]` cannot work on an Intel Mac.
ray = ["ray>=2.9"]
# PySpark ships as an sdist carrying the Spark distribution, so installing it is slow and
# large. It also needs a JVM on the machine, which pip cannot provide.
spark = ["pyspark>=3.4"]

[project.urls]
# GitHub Pages, because PyPI can verify it. A package uploaded through Trusted Publishing
# has the GitHub URLs for its own repository verified, and that includes the project's
# GitHub Pages domain - so this link is shown under "Verified details" rather than under
# "Unverified details", which a readthedocs.io address cannot be. The README points at the
# Read the Docs build, which keeps a copy of every release.
Documentation = "https://oskar-j.github.io/thresher/"
Homepage = "https://github.com/oskar-j/thresher"
Repository = "https://github.com/oskar-j/thresher"
Issues = "https://github.com/oskar-j/thresher/issues"

[dependency-groups]
dev = [
    "openpyxl",  # pandas engine for reading the .xlsx test fixtures
    "pytest",
    "pytest-cov",
    "mypy",
    "ruff",
    "pre-commit",
    "pandas-stubs",
    # Same wheel gap as above. The marker keeps `uv sync --group dev` working on an Intel
    # Mac; the Ray tests skip themselves when the import fails, and CI runs on Linux where
    # Ray installs, so they are exercised for real there.
    "ray>=2.9; sys_platform == 'linux' or (sys_platform == 'darwin' and platform_machine == 'arm64')",
    "pyspark>=3.4",
]
# Kept out of `dev` because the docs toolchain is large and only the docs build needs it.
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thresher"]

[tool.hatch.build.targets.sdist]
# Ship the sources and tests, but not the multi-megabyte performance fixture.
include = ["src", "tests", "docs", "examples", "README.md", "CHANGELOG.md", "LICENSE"]
exclude = ["examples/performance_test/milion_samples.7z"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
# Coverage is opt-in via --cov so a plain `pytest` stays fast; CI always passes it.
filterwarnings = [
    "error",
    # multiprocessing.Pool emits this on interpreter teardown in some CPython builds
    "default::ResourceWarning",
]

[tool.coverage.run]
source = ["src/thresher"]
branch = true

[tool.coverage.report]
# CI enforces this on every matrix job, so a pull request cannot lower coverage below it.
fail_under = 90
show_missing = true
exclude_also = [
    # Script entry points are exercised by running the command, not by importing it.
    'if __name__ == .__main__.:',
    # Protocol method bodies declare a signature and have nothing to run.
    '^\s*\.\.\.$',
]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]
# Notebooks are committed research artifacts, not maintained source. Ruff lints and
# formats .ipynb by default, which would rewrite their recorded contents.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific
]

[tool.mypy]
# No python_version pin: numpy's bundled stubs use 3.12+ syntax, which mypy cannot parse
# when asked to target 3.10. The CI matrix is what actually proves 3.10 compatibility.
files = ["src", "tests"]
strict = true
# numpy and pandas ship types, but their stubs are loose in places; keep the strictness
# on our own code rather than fighting third-party annotations.
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["openpyxl.*"]
ignore_missing_imports = true

# Ray is an optional extra and cannot be installed at all on macOS x86_64, so the type
# checker has to cope with it being absent. The Ray backend imports it lazily and guards
# the ImportError, which is the behaviour that matters.
[[tool.mypy.overrides]]
module = ["ray.*"]
ignore_missing_imports = true

# PySpark is optional too, and is a 450 MB sdist - large enough that adding it to the
# pre-commit mypy hook's `additional_dependencies` would dominate that hook's runtime for
# one module. It is absent there, so the import has to be allowed to go unresolved.
[[tool.mypy.overrides]]
module = ["pyspark.*"]
ignore_missing_imports = true
