[project]
name = "thresher-py"
version = "0.2.1"
description = "Find threshold for fine-tuning output from predict_proba"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Oskar Jarczyk", email = "oskar.jarczyk@gmail.com" }]
maintainers = [{ name = "Oskar Jarczyk", email = "oskar.jarczyk@gmail.com" }]
keywords = ["Hyper-parameters", "Finetuning", "ML", "Optimization", "AutoML"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["numpy", "pandas"]

[project.urls]
Homepage = "https://github.com/oskar-j/thresher"
Repository = "https://github.com/oskar-j/thresher"
Issues = "https://github.com/oskar-j/thresher/issues"

[dependency-groups]
dev = [
    "openpyxl",  # pandas engine for reading the .xlsx test fixtures
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["thresher"]
exclude = ["thresher/tests"]

[tool.hatch.build.targets.sdist]
exclude = ["examples/performance_test/milion_samples.7z"]
