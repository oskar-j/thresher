[project]
name = "thresher-py"
version = "0.3.0"
description = "Find threshold for fine-tuning output from predict_proba"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Oskar Jarczyk", email = "oskar.jarczyk@gmail.com" }]
maintainers = [{ name = "Oskar Jarczyk", email = "oskar.jarczyk@gmail.com" }]
keywords = ["Hyper-parameters", "Finetuning", "ML", "Optimization", "AutoML"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["numpy", "pandas"]

[project.urls]
Homepage = "https://github.com/oskar-j/thresher"
Repository = "https://github.com/oskar-j/thresher"
Issues = "https://github.com/oskar-j/thresher/issues"

[dependency-groups]
dev = [
    "openpyxl",  # pandas engine for reading the .xlsx test fixtures
    "pytest",
    "pytest-cov",
    "mypy",
    "ruff",
    "pre-commit",
    "pandas-stubs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thresher"]

[tool.hatch.build.targets.sdist]
# Ship the sources and tests, but not the multi-megabyte performance fixture.
include = ["src", "tests", "docs", "examples", "README.md", "CHANGELOG.md", "LICENSE"]
exclude = ["examples/performance_test/milion_samples.7z"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
    "error",
    # multiprocessing.Pool emits this on interpreter teardown in some CPython builds
    "default::ResourceWarning",
]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]
# Notebooks are committed research artifacts, not maintained source. Ruff lints and
# formats .ipynb by default, which would rewrite their recorded contents.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific
]

[tool.mypy]
# No python_version pin: numpy's bundled stubs use 3.12+ syntax, which mypy cannot parse
# when asked to target 3.10. The CI matrix is what actually proves 3.10 compatibility.
files = ["src", "tests"]
strict = true
# numpy and pandas ship types, but their stubs are loose in places; keep the strictness
# on our own code rather than fighting third-party annotations.
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["openpyxl.*"]
ignore_missing_imports = true
